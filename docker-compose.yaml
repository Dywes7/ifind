services:
  meu_mysql:
    image: 'mysql:latest'
    container_name: mysql_container
    environment:
      - 'MYSQL_DATABASE=ifind'
      - 'MYSQL_PASSWORD=ifind123'
      - 'MYSQL_ROOT_PASSWORD=ifind123'
      - 'MYSQL_USER=user'
    ports:
      - '3306:3306'
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 10s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: meu_mysql

  ifind:
    build: .
    ports:
      - "80:8080"
    env_file:
      - .env
    depends_on:
      - meu_mysql