services:
  meu_mysql:
    image: 'mysql:latest'
    container_name: mysql_container
    environment:
      - 'MYSQL_DATABASE=ifind'
      - 'MYSQL_PASSWORD=ifind123'
      - 'MYSQL_ROOT_PASSWORD=ifind123'
      - 'MYSQL_USER=user'
    ports:
      - '3306:3306'

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: meu_mysql